name: xiaobaihe_app
description: "小白盒内容社区 Flutter 应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.3.4
  cached_network_image: ^4.0.0
  image_picker: ^1.1.2
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  http: ^1.6.0
  http_parser: ^4.1.2
  forui: ^0.26.0
  material_ui: ^1.0.0
  gpt_markdown: ^1.1.8
  characters: ^1.4.0
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.2

dependency_overrides:
  shared_preferences_android: 2.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Forui 0.26.0 delegates adaptive text-selection affordances to Flutter.
  uses-material-design: true
