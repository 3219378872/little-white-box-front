name: xiaobaihe_app
description: "小白盒内容社区 Flutter 应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.3.4
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.1
  intl: ^0.20.2
  http: ^1.6.0
  http_parser: ^4.1.2
  forui: ^0.24.2
  gpt_markdown: ^1.1.8
  visibility_detector: ^0.4.0+2

dependency_overrides:
  shared_preferences_android: 2.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Forui 0.24.2 delegates adaptive text-selection affordances to Flutter.
  uses-material-design: true
